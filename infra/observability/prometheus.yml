# KARTEX Phase C — Prometheus scrape + alerting config.
# App metrics: pull from /api/metrics (persistent deploys) AND collector-derived
# OTLP metrics from the otel-collector. Runtime metrics: native endpoints +
# exporters (see README for the redis/kafka/neo4j exporter sidecars).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: kartex

rule_files:
  - /etc/prometheus/alerts.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # ---- Application ----
  - job_name: kartex-app
    metrics_path: /api/metrics
    scheme: http
    # If METRICS_AUTH_TOKEN is set, provide it here:
    # authorization: { type: Bearer, credentials_file: /etc/prometheus/metrics_token }
    static_configs:
      - targets: ["host.docker.internal:3000"]
        labels: { service: vendorhub-web }

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # ---- Phase B runtimes ----
  - job_name: qdrant
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:6333"]

  - job_name: flink
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8082"]

  # Require exporter sidecars (see infra/observability/README.md):
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
  - job_name: neo4j
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:2004"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

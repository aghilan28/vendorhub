# KARTEX Phase B — Redis runtime configuration (local/staging baseline)
# Production overrides (TLS, ACLs, cluster) are applied by the managed provider
# (Upstash / ElastiCache). This file documents the persistence + eviction contract.

################################## NETWORK ####################################
bind 0.0.0.0
protected-mode yes
port 6379
tcp-keepalive 300
timeout 0

################################## SECURITY ###################################
# Local password only. Production: per-environment secret + TLS + ACL users.
requirepass localdevredis
# Disable destructive commands in shared environments.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command KEYS ""

################################## MEMORY #####################################
# Bound memory and evict volatile keys first so cache pressure never evicts
# durable state (locks / idempotency keys are written WITHOUT TTL-less risk via
# allkeys protection: those use the persistent keyspace, see key-conventions).
maxmemory 512mb
maxmemory-policy volatile-lru
maxmemory-samples 5

################################## PERSISTENCE ################################
# AOF (everysec) + RDB snapshots: cache can be lost, but locks/queues/idempotency
# survive restart. RPO target <= 1s for AOF-backed keys.
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
save 900 1
save 300 10
save 60 10000
rdb-del-sync-files no
dir /data

################################## CLIENTS ####################################
maxclients 10000

################################## SLOWLOG ####################################
slowlog-log-slower-than 10000
slowlog-max-len 256

################################## LATENCY ####################################
latency-monitor-threshold 100

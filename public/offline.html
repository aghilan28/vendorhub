<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#059669" />
    <title>VendorHub offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(420px, 100%);
        border: 1px solid #d1fae5;
        border-radius: 8px;
        background: #fff;
        padding: 24px;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
      }
      .mark {
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        border-radius: 8px;
        background: #ecfdf5;
        color: #047857;
        font-weight: 800;
      }
      h1 {
        margin: 18px 0 8px;
        font-size: 22px;
      }
      p {
        margin: 0;
        color: #475569;
        line-height: 1.55;
      }
      button {
        margin-top: 20px;
        min-height: 44px;
        width: 100%;
        border: 0;
        border-radius: 8px;
        background: #059669;
        color: white;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">VH</div>
      <h1>You are offline</h1>
      <p>VendorHub can still show cached pages and product views. Reconnect to place orders, refresh stock, or receive delivery updates.</p>
      <button type="button" onclick="window.location.reload()">Retry connection</button>
    </main>
  </body>
</html>
